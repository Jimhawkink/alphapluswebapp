<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Royal Indigo & Midnight Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#312e81"/>
      <stop offset="70%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- 24K Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Accent Golden Light Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Pearl Architectural White Gradient -->
    <linearGradient id="pearlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Top Luxury Glass Sheen -->
    <radialGradient id="glassSheen" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Golden Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Body -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- 2. Top Luxury Sheen Reflection -->
  <rect width="512" height="512" rx="116" fill="url(#glassSheen)"/>

  <!-- 3. Dual Metallic Luxury Border Rims -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.7"/>
  <rect x="22" y="22" width="468" height="468" rx="96" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- 4. Corner Luxury Accents -->
  <circle cx="56" cy="56" r="3.5" fill="url(#goldLight)"/>
  <circle cx="456" cy="56" r="3.5" fill="url(#goldLight)"/>
  <circle cx="56" cy="456" r="3.5" fill="url(#goldLight)"/>
  <circle cx="456" cy="456" r="3.5" fill="url(#goldLight)"/>

  <!-- 5. Main Icon Emblem Group with Luxury Drop Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Hotel Villa & Resort Grand Roof Gable -->
    <path d="M 256 96 L 396 200 L 372 200 L 372 376 L 140 376 L 140 200 L 116 200 Z"
          fill="none"
          stroke="url(#pearlGrad)"
          stroke-width="16"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Inner Hotel Architectural Facade Line -->
    <path d="M 256 136 L 354 212 L 354 360 L 158 360 L 158 212 Z"
          fill="#1e1b4b"
          fill-opacity="0.5"
          stroke="url(#goldGrad)"
          stroke-width="4"
          stroke-linejoin="round"/>

    <!-- Grand Archway Portal (Illuminated Hotel & Restaurant Entrance) -->
    <path d="M 216 360 L 216 268 A 40 40 0 0 1 296 268 L 296 360 Z"
          fill="url(#goldGrad)"
          fill-opacity="0.95"/>
    <path d="M 228 360 L 228 274 A 28 28 0 0 1 284 274 L 284 360 Z"
          fill="#1e1b4b"
          fill-opacity="0.8"/>

    <!-- Subtle Golden Door Dividing Line -->
    <line x1="256" y1="264" x2="256" y2="360" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Hotel Room Windows / Balconies (Upper Tier) -->
    <!-- Left Suite Window -->
    <rect x="180" y="224" width="28" height="32" rx="6" fill="url(#goldLight)" fill-opacity="0.9"/>
    <line x1="194" y1="224" x2="194" y2="256" stroke="#312e81" stroke-width="2"/>
    <line x1="180" y1="240" x2="208" y2="240" stroke="#312e81" stroke-width="2"/>

    <!-- Right Suite Window -->
    <rect x="304" y="224" width="28" height="32" rx="6" fill="url(#goldLight)" fill-opacity="0.9"/>
    <line x1="318" y1="224" x2="318" y2="256" stroke="#312e81" stroke-width="2"/>
    <line x1="304" y1="240" x2="332" y2="240" stroke="#312e81" stroke-width="2"/>

    <!-- Center Mezzanine Rose Arch Window -->
    <path d="M 240 216 A 16 16 0 0 1 272 216 Z" fill="url(#goldLight)" fill-opacity="0.9"/>

    <!-- 6. THE ALPHA PLUS ("A+") ROOF CREST -->
    <!-- Stylized Brilliant Diamond Star at the Peak -->
    <g transform="translate(256, 92)" filter="url(#goldGlow)">
      <!-- 4-point Diamond Star -->
      <path d="M 0 -36 Q 4 -8 24 0 Q 4 8 0 36 Q -4 8 -24 0 Q -4 -8 0 -36 Z"
            fill="url(#goldLight)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>

    <!-- Golden "PLUS" Accent Badge on Right Roof Tier -->
    <g transform="translate(382, 186)">
      <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
      <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Fine Dining Fork & Knife / Wine Luxury Emblem Base (Plinth) -->
    <rect x="120" y="376" width="272" height="18" rx="6" fill="url(#goldGrad)"/>
    <rect x="136" y="398" width="240" height="10" rx="4" fill="url(#pearlGrad)" fill-opacity="0.8"/>
  </g>

  <!-- 7. Golden Hospitality Laurel Leaves at Base -->
  <g fill="url(#goldGrad)" opacity="0.9" transform="translate(256, 432)">
    <!-- Center 5-Star Rating Array -->
    <g transform="translate(0, -6)">
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(-56, 0) scale(0.9)"/>
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(-28, 0) scale(0.9)"/>
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(0, -2) scale(1.15)"/>
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(28, 0) scale(0.9)"/>
      <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(56, 0) scale(0.9)"/>
    </g>

    <!-- Brand Typography Subtext -->
    <text x="0" y="24"
          text-anchor="middle"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="19"
          font-weight="900"
          letter-spacing="5"
          fill="url(#goldLight)">ALPHA PLUS</text>
  </g>
</svg>
